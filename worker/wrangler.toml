name = "openbat-guide-submit"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Rate-limit counters, keyed by IP. Create it once and paste the id here:
#   npx wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "cfd11b8a2b1448e8b56a7fb5ef27b995"

# GITHUB_TOKEN is a SECRET and must never be written here — this file is
# committed. Set it with:
#   npx wrangler secret put GITHUB_TOKEN

# Served from the site's own domain rather than *.workers.dev, so the CSP entry
# and the privacy page both name openbat.app rather than a third party.
# openbat.app is on Cloudflare DNS, so the DNS record is created automatically.
[[routes]]
pattern = "api.openbat.app"
custom_domain = true
